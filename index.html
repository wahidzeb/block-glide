:root{--ink:#2d2557;--ink2:#6b6394;--card:#ffffff;--line:#ece8fb;--pri:#2fd07e;--pri2:#16a862;--pri3:#0d8a4d;--blu:#4f8cff;--blu2:#2f66e0;--blu3:#1d48b0;--pink:#ff5f9e;--pink2:#e63a7f;--pink3:#b52262;--gold:#ffc93c;--gold2:#ff9f1c;--gold3:#c86f00;--r:22px;--sh:0 10px 30px rgba(60,40,140,.18),0 2px 6px rgba(60,40,140,.08);--font:"Baloo","Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#c9bcff;color:var(--ink);font-family:var(--font);font-weight:600;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:none}
body{position:fixed;inset:0}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
canvas#fxc{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:30}
#tip{position:fixed;left:50%;transform:translateX(-50%);max-width:min(340px,90vw);text-align:center;background:#fff;color:var(--ink);font-size:18px;font-weight:700;line-height:1.25;padding:10px 18px 12px;border-radius:18px;box-shadow:0 10px 24px rgba(60,40,140,.2),inset 0 -4px 0 #e6e0fc;pointer-events:none;animation:tipin .5s cubic-bezier(.2,1.4,.4,1) both}
#tip::before{content:"";position:absolute;left:50%;top:-8px;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#fff}
@keyframes tipin{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.9)}}
canvas#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 12px) 14px calc(var(--sab) + 12px);overflow:hidden}
.scr.in>.anim,.scr.in .anim{animation:rise .26s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--d,0)*28ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:rgba(40,25,100,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:20}
.modal.in{animation:fade .14s ease both}.modal.in .card{animation:popin .24s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fade{from{opacity:0}}@keyframes popin{from{opacity:0;transform:scale(.8) translateY(20px)}}
.card{background:var(--card);border-radius:28px;box-shadow:0 24px 60px rgba(40,20,120,.35),0 0 0 1px rgba(255,255,255,.6) inset;width:100%;max-width:380px;padding:22px 18px 18px;position:relative;text-align:center;max-height:100%;display:flex;flex-direction:column}
.card h2{font-size:30px;font-weight:800;line-height:1;margin:4px 0 6px;color:var(--ink);letter-spacing:.3px}
.card .sub{font-size:15px;color:var(--ink2);font-weight:600;line-height:1.3}
.ribbon{position:relative;margin:-48px auto 8px;padding:10px 34px 12px;font-size:26px;font-weight:800;color:#fff;background:linear-gradient(180deg,#ff7bb0,#ff4f92);border-radius:16px;box-shadow:0 6px 0 #c22a68,0 12px 22px rgba(200,40,110,.35);text-shadow:0 2px 0 rgba(150,20,80,.4);white-space:nowrap;letter-spacing:.5px}
.ribbon.blue{background:linear-gradient(180deg,#7fb0ff,#4f86ff);box-shadow:0 6px 0 #2b56c4,0 12px 22px rgba(40,80,200,.35);text-shadow:0 2px 0 rgba(20,50,150,.4)}
.ribbon.grey{background:linear-gradient(180deg,#a99fd6,#7f73bd);box-shadow:0 6px 0 #564b94,0 12px 22px rgba(60,40,140,.35)}
.x{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;background:#f3f0ff;color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.x:active{transform:scale(.9)}.x svg{width:20px;height:20px}
/* buttons */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:8px 18px 12px;border-radius:20px;font-size:22px;font-weight:800;color:#fff;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.18);background:linear-gradient(180deg,#5ff0a2 0%,var(--pri) 45%,var(--pri2) 100%);box-shadow:inset 0 -5px 0 var(--pri3),0 8px 16px rgba(20,140,80,.3),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .1s,box-shadow .1s,filter .15s}
.btn::after{content:"";position:absolute;left:10px;right:10px;top:5px;height:36%;border-radius:14px 14px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(3px) scale(.98);box-shadow:inset 0 -2px 0 var(--pri3),0 3px 8px rgba(20,140,80,.3)}
.btn.blue{background:linear-gradient(180deg,#8ab6ff 0%,var(--blu) 45%,var(--blu2) 100%);box-shadow:inset 0 -5px 0 var(--blu3),0 8px 16px rgba(40,90,220,.3),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.pink{background:linear-gradient(180deg,#ff9cc4 0%,var(--pink) 45%,var(--pink2) 100%);box-shadow:inset 0 -5px 0 var(--pink3),0 8px 16px rgba(220,40,120,.3),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.gold{color:#7a3d00;text-shadow:0 1px 0 rgba(255,255,255,.5);background:linear-gradient(180deg,#ffe58a 0%,var(--gold) 45%,var(--gold2) 100%);box-shadow:inset 0 -5px 0 var(--gold3),0 8px 16px rgba(220,140,20,.3),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.soft{color:var(--ink);text-shadow:none;background:linear-gradient(180deg,#fff,#f1edff);box-shadow:inset 0 -4px 0 #d9d1fb,0 6px 14px rgba(60,40,140,.14)}
.btn.sm{min-height:44px;font-size:17px;border-radius:15px;padding:6px 12px 9px}
.btn.big{min-height:66px;font-size:28px;border-radius:24px}
.btn[disabled]{filter:grayscale(.7) opacity(.75)}
.btn svg{width:24px;height:24px;flex:none}
.btn .pr{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.16);padding:1px 10px 2px 6px;border-radius:999px;font-size:16px}
.ibtn{width:50px;height:50px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff,#f3f0ff);color:var(--ink);box-shadow:inset 0 -4px 0 #dcd4fb,0 6px 14px rgba(60,40,140,.16);transition:transform .1s;position:relative}
.ibtn:active{transform:translateY(2px) scale(.94)}
.ibtn svg{width:26px;height:26px}
.ibtn .dot{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:#ff4d6d;border:3px solid #fff;animation:beat 1.2s infinite}
@keyframes beat{50%{transform:scale(1.25)}}
.row{display:flex;gap:10px;width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 6px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(60,40,140,.14),inset 0 -3px 0 #e3dcfc;font-size:19px;font-weight:800;color:var(--ink);white-space:nowrap}
.pill i{display:inline-flex}
.ic-coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4 0 18%,#ffd84a 40%,#f2a10c 100%);box-shadow:inset 0 -2px 0 #c97800,0 1px 2px rgba(0,0,0,.2);position:relative;flex:none;display:inline-block}
.ic-coin::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(201,120,0,.55)}
.ic-star{width:26px;height:26px;flex:none;display:inline-block;background:linear-gradient(180deg,#fff2a0,#ffc928 55%,#ff9d0a);clip-path:polygon(50% 2%,63% 34%,98% 37%,71% 59%,80% 95%,50% 76%,20% 95%,29% 59%,2% 37%,37% 34%)}
.credit{font-size:14px;color:var(--ink2);font-weight:700;letter-spacing:.3px}
.links{display:flex;gap:18px;justify-content:center;font-size:15px;font-weight:700}
.links a{color:var(--ink);text-decoration:none;opacity:.8;border-bottom:2px solid rgba(45,37,87,.25);padding-bottom:1px}
.adslot{width:100%;max-width:340px;height:56px;flex:none;border-radius:14px;border:2px dashed rgba(45,37,87,.14);background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(45,37,87,.35);letter-spacing:2px;font-weight:700}
/* title */
#title{justify-content:space-between}
#title .top{display:flex;width:100%;max-width:440px;justify-content:space-between;align-items:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2vh}
.logo .w{display:flex;gap:min(1.6vw,7px)}
.logo .t{--s:min(14.5vw,64px);width:var(--s);height:calc(var(--s)*1.08);border-radius:calc(var(--s)*.28);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.78);font-weight:800;color:#fff;line-height:1;padding-top:calc(var(--s)*.1);background:var(--c);box-shadow:inset 0 calc(var(--s)*-.12) 0 rgba(0,0,0,.18),inset 0 calc(var(--s)*.06) 0 rgba(255,255,255,.45),0 calc(var(--s)*.12) calc(var(--s)*.2) rgba(60,30,140,.25);text-shadow:0 3px 0 rgba(0,0,0,.15);animation:tbob 2.4s cubic-bezier(.45,0,.55,1) infinite;animation-delay:calc(var(--i)*.12s);position:relative}
.logo .t::before{content:"";position:absolute;left:14%;right:14%;top:8%;height:26%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0))}
@keyframes tbob{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px) rotate(-3deg)}55%{transform:translateY(0) scale(1.04,.94)}70%{transform:translateY(-2px)}}
.byz{margin-top:8px;font-size:20px;font-weight:800;color:#fff;padding:3px 18px 5px;border-radius:999px;background:linear-gradient(180deg,#5b4bc4,#3b2d96);box-shadow:0 4px 0 #261c6e,0 8px 18px rgba(40,25,120,.35);letter-spacing:.6px}
.tmenu{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;align-items:center}
.daily{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:rgba(255,255,255,.9);box-shadow:var(--sh),inset 0 -4px 0 #e6e0fc;text-align:left;transition:transform .1s}
.daily:active{transform:scale(.97)}
.daily .ico{width:48px;height:48px;border-radius:15px;background:linear-gradient(180deg,#ffb35c,#ff7a2f);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.daily .ico svg{width:28px;height:28px}
.daily b{display:block;font-size:19px;font-weight:800;line-height:1.1}
.daily small{font-size:14px;color:var(--ink2);font-weight:600}
.daily .go{margin-left:auto;font-size:15px;font-weight:800;color:#fff;background:var(--pink);padding:4px 12px 6px;border-radius:12px;box-shadow:inset 0 -3px 0 var(--pink3)}
.daily .go.done{background:#bfb6e6;box-shadow:inset 0 -3px 0 #958ac6}
.tbar{display:flex;gap:12px;justify-content:center}
.tbar .ibtn{width:62px;height:62px;border-radius:22px;flex-direction:column;gap:0;font-size:11px;font-weight:800;color:var(--ink2)}
.tbar .ibtn svg{width:28px;height:28px;color:var(--ink)}
/* top bar for sub screens */
.tb{display:flex;align-items:center;gap:10px;width:100%;max-width:520px;flex:none;z-index:2}
.tb h1{flex:1;font-size:26px;font-weight:800;text-align:center;letter-spacing:.3px;color:var(--ink)}
/* map */
#map{padding-left:0;padding-right:0}
#map .tb{padding:0 14px}
#mapScroll{flex:1;width:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;position:relative;margin-top:8px;mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent)}
#mapInner{position:relative;width:100%;max-width:460px;margin:0 auto}
.chap{position:relative;padding:20px 0 10px}
.chban{position:relative;margin:0 auto 6px;width:calc(100% - 40px);max-width:360px;border-radius:22px;padding:12px 16px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px rgba(60,30,140,.22),inset 0 -5px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.35)}
.chban .num{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex:none}
.chban b{display:block;font-size:21px;font-weight:800;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.chban small{font-size:13.5px;opacity:.95;font-weight:700}
.chban .cs{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:16px;font-weight:800;background:rgba(0,0,0,.15);border-radius:999px;padding:2px 10px 2px 4px}
.chban .cs .ic-star{width:20px;height:20px}
.chban.lockd{filter:grayscale(.6) brightness(.95);opacity:.85}
.path{position:relative}
.path>svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.45),rgba(255,255,255,0) 55%),var(--nc);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 8px 14px rgba(60,30,140,.25),0 0 0 4px #fff;text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .12s}
.node:active{transform:scale(.92)}
.node.lk{background:#e6e1f7;color:#b3abd6;text-shadow:none;box-shadow:inset 0 -5px 0 #cfc7ec,0 0 0 4px rgba(255,255,255,.7)}
.node.lk svg{width:22px;height:22px}
.node.cur{width:76px;height:76px;margin:-38px 0 0 -38px;font-size:30px;animation:nodep 1.4s ease-in-out infinite}
@keyframes nodep{50%{transform:scale(1.07)}}
.node.hard::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px dashed rgba(255,80,120,.55)}
.node .st{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .st i{width:17px;height:17px;background:linear-gradient(180deg,#fff2a0,#ffc928 55%,#ff9d0a);clip-path:polygon(50% 2%,63% 34%,98% 37%,71% 59%,80% 95%,50% 76%,20% 95%,29% 59%,2% 37%,37% 34%);filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}
.node .st i.o{background:#d9d3ef}
.node .st i:nth-child(2){transform:translateY(4px)}
.marker{position:absolute;width:44px;height:52px;margin:-100px 0 0 -22px;pointer-events:none;animation:mk 1.2s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(60,30,140,.3))}
@keyframes mk{50%{transform:translateY(-8px)}}
.deco{position:absolute;border-radius:12px;opacity:.55;pointer-events:none}
#mapPlay{flex:none;width:calc(100% - 28px);max-width:340px;margin-top:8px}
body.dark #lvlTag b,body.dark .tb h1{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}body.dark #lvlTag small{color:#cfc8ff}body.dark #title .links a{color:#fff;border-color:rgba(255,255,255,.4)}body.dark .adslot{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.35)}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .hrow{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) 12px 0;display:flex;align-items:center;gap:8px;pointer-events:none}
#hud .hrow>*{pointer-events:auto}
#lvlTag{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1}
#lvlTag b{font-size:24px;font-weight:800;color:var(--ink)}
#lvlTag small{font-size:13px;font-weight:800;letter-spacing:1px;color:var(--ink2);text-transform:uppercase;margin-top:2px}
#lvlTag small.hard{color:#ff3d71}
#limit{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 70px);display:flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 8px;border-radius:999px;background:#fff;box-shadow:0 6px 16px rgba(60,40,140,.18),inset 0 -4px 0 #e6e0fc;font-size:26px;font-weight:800;pointer-events:auto;min-width:118px;justify-content:center}
#limit .lic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(180deg,#8ab6ff,#4f86ff);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
#limit .lic svg{width:20px;height:20px}
#limit.mv .lic{background:linear-gradient(180deg,#ffb36b,#ff7a2f)}
#limit.low{color:#ff3d71;animation:lowp .6s ease-in-out infinite}
#limit.frz .lic{background:linear-gradient(180deg,#b8f3ff,#38c9f0)}
#limit.frz{color:#18a6d6}
@keyframes lowp{50%{transform:translateX(-50%) scale(1.08)}}
#boosts{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:0 10px calc(var(--sab) + 14px);pointer-events:none}
.bst{pointer-events:auto;position:relative;width:min(16.5vw,66px);height:min(16.5vw,66px);border-radius:22px;background:linear-gradient(180deg,#fff,#f3f0ff);box-shadow:inset 0 -5px 0 #dcd4fb,0 8px 18px rgba(60,40,140,.2);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.bst:active{transform:translateY(3px) scale(.92)}
.bst svg{width:62%;height:62%}
.bst .ct{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--pink);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--pink3),0 0 0 3px #fff}
.bst .ct.plus{background:var(--pri);box-shadow:0 2px 0 var(--pri3),0 0 0 3px #fff}
.bst.sel{background:linear-gradient(180deg,#fff7c9,#ffe27a);box-shadow:inset 0 -5px 0 #f5b631,0 0 0 4px #fff,0 0 0 8px rgba(255,201,60,.6);animation:selp .8s infinite}
@keyframes selp{50%{transform:scale(1.06)}}
.bst.off{opacity:.45;filter:grayscale(.6)}
#bhint{position:absolute;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;font-size:16px;font-weight:700;padding:8px 16px 10px;border-radius:14px;white-space:nowrap;box-shadow:0 8px 20px rgba(30,20,80,.3)}
@media (orientation:landscape) and (max-height:560px){
  #boosts{left:auto;top:0;flex-direction:column;justify-content:center;padding:0 calc(env(safe-area-inset-right) + 12px) 0 0;width:auto}
  .bst{width:min(13vh,60px);height:min(13vh,60px)}
  #limit{left:calc(env(safe-area-inset-left) + 12px);transform:none;top:calc(var(--sat) + 74px)}
  @keyframes lowp{50%{transform:scale(1.08)}}
  #lvlTag{flex:none;align-items:flex-start;margin-left:4px;margin-right:auto}
  #hCoins{display:none}
  #title{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;align-items:center;justify-items:center;column-gap:16px;padding-top:calc(var(--sat) + 8px);padding-bottom:calc(var(--sab) + 6px)}
  #title .top{grid-column:1/3;max-width:none}
  #title .logo{grid-column:1;grid-row:2;margin:0}
  #title .tmenu{grid-column:2;grid-row:2;gap:9px;max-width:min(340px,46vw)}
  #title .tbar{gap:min(8px,1.2vw)}
  #title .tmenu{width:100%}
  .tbar .ibtn{width:min(52px,8.6vw);height:min(52px,8.6vw)}
  #title .foot{grid-column:1/3;grid-row:3;flex-direction:row!important;justify-content:center;gap:18px!important}
  #title .foot .adslot{max-width:320px;height:46px}
  .btn.big{min-height:54px;font-size:24px}
  .tbar .ibtn{width:52px;height:52px;border-radius:18px;font-size:10px}.tbar .ibtn svg{width:24px;height:24px}
  #map .tb{max-width:none}
  #bhint{bottom:12px}
  .logo .t{--s:min(12vh,7vw,56px)}
  #title .tmenu{max-width:520px}
}
/* toggles / lists */
.list{display:flex;flex-direction:column;gap:10px;overflow-y:auto;touch-action:pan-y;min-height:0;margin:10px -4px 0;padding:4px}
.it{display:flex;align-items:center;gap:12px;background:#f7f5ff;border-radius:18px;padding:10px 12px;text-align:left}
.it .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.it .ic svg{width:24px;height:24px}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:17px;font-weight:800;line-height:1.15}.it .tx small{font-size:13.5px;color:var(--ink2);font-weight:600;line-height:1.2;display:block}
.tg{width:58px;height:34px;border-radius:999px;background:#d9d3ef;position:relative;flex:none;transition:background .2s;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.tg::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tg.on{background:var(--pri)}.tg.on::after{transform:translateX(24px)}
.seg{display:flex;background:#ece8fb;border-radius:12px;padding:3px;gap:2px}
.seg button{font-size:13px;font-weight:800;padding:5px 9px;border-radius:9px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(60,40,140,.15)}
.bar{height:10px;border-radius:999px;background:#e6e1f7;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5ff0a2,#16a862);border-radius:999px}
/* shop */
.tabs{display:flex;gap:6px;background:#efebff;border-radius:16px;padding:4px;margin-top:6px}
.tabs button{flex:1;padding:8px 4px 9px;border-radius:12px;font-size:15px;font-weight:800;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 3px 8px rgba(60,40,140,.14)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow-y:auto;touch-action:pan-y;min-height:0;padding:4px;margin:10px -4px 0}
.sk{background:#f7f5ff;border-radius:20px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;border:3px solid transparent;transition:transform .1s}
.sk:active{transform:scale(.96)}
.sk.eq{border-color:var(--pri);background:#ecfff4}
.sk canvas{width:100%;aspect-ratio:1.5;border-radius:14px}
.sk b{font-size:16px;font-weight:800}
.sk .tagb{font-size:14px;font-weight:800;padding:2px 12px 3px;border-radius:999px;background:#fff;color:var(--ink2);display:flex;align-items:center;gap:4px}
.sk .tagb .ic-coin{width:18px;height:18px}.sk .tagb .ic-coin::after{inset:4px;border-width:1.5px}
.sk.eq .tagb{background:var(--pri);color:#fff}
/* win */
.stars3{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:6px 0 4px;height:92px;position:relative}
.stars3::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,214,90,.28) 0 10deg,rgba(255,214,90,0) 10deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 68%);mask-image:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 14s linear infinite;pointer-events:none;z-index:0}
.stars3 i{z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.stars3 i{width:72px;height:72px;background:#e7e2f8;clip-path:polygon(50% 2%,63% 34%,98% 37%,71% 59%,80% 95%,50% 76%,20% 95%,29% 59%,2% 37%,37% 34%);position:relative}
.stars3 i:nth-child(2){width:90px;height:90px;margin-bottom:12px}
.stars3 i.on{background:linear-gradient(180deg,#fff6b8,#ffcf33 50%,#ff9a0a);animation:starin .3s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starin{from{transform:scale(0) rotate(-60deg)}}
.stats{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
.stats div{flex:1;background:#f6f3ff;border-radius:16px;padding:8px 6px}
.stats b{display:flex;align-items:center;justify-content:center;gap:5px;font-size:24px;font-weight:800;line-height:1.1}
.stats small{font-size:12.5px;font-weight:800;letter-spacing:.8px;color:var(--ink2);text-transform:uppercase}
.btns{display:flex;flex-direction:column;gap:10px}
/* misc */
#toast{position:fixed;left:50%;top:calc(var(--sat) + 120px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px 12px;border-radius:16px;font-size:17px;font-weight:700;z-index:50;box-shadow:0 10px 26px rgba(30,20,80,.35);transition:opacity .3s,transform .3s;white-space:nowrap;pointer-events:none}
#toast.hide{opacity:0;transform:translateX(-50%) translateY(-12px)}
.howcv{width:100%;max-width:300px;aspect-ratio:1.6;margin:8px auto 4px;border-radius:18px;background:#f4f1ff;display:block}
.steps{display:flex;justify-content:center;gap:6px;margin:8px 0 12px}.steps i{width:8px;height:8px;border-radius:4px;background:#ddd6f6;transition:width .25s}.steps i.on{width:24px;background:var(--blu)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 14px}
.day{border-radius:16px;background:#f5f2ff;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:800;color:var(--ink2);position:relative}
.day b{font-size:16px;color:var(--ink);display:flex;align-items:center;gap:3px}
.day .ic-coin{width:22px;height:22px}
.day.got{opacity:.5}.day.got::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--pri2)}
.day.now{background:linear-gradient(180deg,#fff4c2,#ffe07a);box-shadow:0 0 0 3px var(--gold2);animation:selp 1s infinite}
.day.d7{grid-column:span 2}
.mech{width:120px;height:120px;margin:4px auto 6px;display:block}
@media (max-height:640px){.logo{margin-top:0}.logo .t{--s:min(12vw,50px)}.btn.big{min-height:58px;font-size:24px}.daily{padding:7px 10px}.tbar .ibtn{width:54px;height:54px}.adslot{height:50px}}
/* === AD SLOTS: DISABLED (AdSense review pending) ===
   Empty .adslot placeholders are hidden completely (display:none, no reserved box, no "AD" label)
   so nothing near the Play/primary buttons looks like accidental-click bait.
   RE-ENABLE LATER: put the real ad code inside the slot, then add class "ads-on" to <body> (or delete this rule).
   PLACEMENT RULE: a re-enabled ad must sit at least ~150px away from Play/primary buttons
   (AdSense accidental-click policy) - move/space the slot accordingly before turning it on. */
body:not(.ads-on) .adslot{display:none!important}
@media (max-height:500px){.modal{padding-top:calc(var(--sat) + 30px);padding-bottom:calc(var(--sab) + 8px)}.card{padding:14px 14px 10px}.card h2{font-size:22px;margin:2px 0}.ribbon{margin:-34px auto 4px;font-size:20px;padding:6px 26px 8px}.stars3{height:54px;margin:0}.stars3::before{width:180px;height:180px;margin:-90px 0 0 -90px}.stars3 i{width:42px;height:42px}.stars3 i:nth-child(2){width:54px;height:54px;margin-bottom:6px}.stats{margin:4px 0 8px}.stats div{padding:4px 6px}.stats b{font-size:18px}.card .btn{min-height:44px;font-size:18px;border-radius:15px;padding:5px 12px 8px}.card .btn.big{min-height:48px;font-size:20px}.card .mech{width:120px;height:120px}}
#tip.side::before{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- TITLE -->
<div id="title" class="scr hidden">
  <div class="top anim">
    <div class="pill"><i class="ic-coin"></i><span class="coinV">0</span></div>
    <div class="pill"><i class="ic-star"></i><span class="starV">0</span></div>
  </div>
  <div class="logo anim" style="--d:1">
    <div class="w" id="logo1"></div>
    <div class="w" id="logo2"></div>
    <div class="byz">by Zaib</div>
  </div>
  <div class="tmenu">
    <button class="btn big anim" style="--d:2" id="bPlay"><span id="playLbl">Play</span></button>
    <button class="daily anim" style="--d:3" id="bDaily"><div class="ico" data-i="cal"></div><div><b>Daily Challenge</b><small id="dailySub">New puzzle every day</small></div><span class="go" id="dailyGo">Play</span></button>
    <div class="tbar anim" style="--d:4">
      <button class="ibtn" id="bGift"><span data-i="gift"></span>Gift<span class="dot hidden" id="giftDot"></span></button>
      <button class="ibtn" id="bShop"><span data-i="bag"></span>Shop</button>
      <button class="ibtn" id="bAch"><span data-i="trophy"></span>Awards<span class="dot hidden" id="achDot"></span></button>
      <button class="ibtn" id="bHow"><span data-i="help"></span>How</button>
      <button class="ibtn" id="bSet"><span data-i="gear"></span>Settings</button>
    </div>
  </div>
  <div class="anim foot" style="--d:5;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%">
    <div class="adslot" id="ad-title"></div>
    <div class="links"><a href="https://zaibgames.com/" target="_blank" rel="noopener">More games</a><a href="https://zaibgames.com/privacy/" target="_blank" rel="noopener">Privacy</a></div>
  </div>
</div>

<!-- MAP -->
<div id="map" class="scr hidden">
  <div class="tb anim"><button class="ibtn" id="mapBack"><span data-i="back"></span></button><h1>Level Map</h1><div class="pill"><i class="ic-star"></i><span class="starV">0</span></div></div>
  <div id="mapScroll"><div id="mapInner"></div></div>
  <button class="btn big anim" id="mapPlay" style="--d:2">Play</button>
  <div class="adslot anim" id="ad-map" style="--d:3;margin-top:8px;height:50px"></div>
